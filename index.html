<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Моя Вселенная ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="cosmic-canvas"></canvas>

    <div class="card-content" id="card-text">
        <h2>Для самой любимой девушки! 🌟</h2>
        <p>В этот день я сделал тебе подарочек, о котором ты просила.</p>
        <!-- Кнопка трансформации частиц в QR -->
        <button id="qr-btn" class="action-btn">Открыть сюрприз 🎁</button>
    </div>


    <!-- Скрытое изображение QR-кода (положите файл qr.png в папку с сайтом) -->
    <img id="qr-image" src="qr.png" alt="QR Code" style="display: none;">
	
<div class="qr-overlay-container">
    <div id="final-text-container" class="glowing-text"></div>
</div>

    <script src="script.js"></script>
</body>
</html>
